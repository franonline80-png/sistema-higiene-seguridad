function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function setMessage(id,text,isError=false){

function isCheckbox(field){return field[2]==="checkbox"}
function isReference(field){return field[2].startsWith("ref:")}
function referenceTable(field){return field[2].split(":")[1]}
function moduleConfig(id){return configs[id]}
function visibleModules(){

function buildNav(){

  visibleModules().forEach(m=>{

    b.className="nav-tab"+(activeModule===m.id?" active":"");
    b.textContent=m.icon+" "+m.label;
    b.onclick=()=>openModule(m.id);nav.appendChild(b);
  });
}
function openModule(id){
  activeModule=id;editing=null;searchText="";buildNav();
  if(id==="inicio"){renderHome();return}
  if(id==="legislacion"){renderLegislation();return}
  if(configs[id])renderCrud(id);
}
async function fetchRows(table,limit=500){
  let q=db.from(table).select("*").limit(limit);
  if(table==="organizaciones")q=q.in("id",getOrgIds());
  else if(table==="establecimientos"||table==="personas"||table==="accidentes_incidentes"||
          table==="inspecciones"||table==="mediciones_ambientales"||table==="epp"||
          table==="capacitaciones"||table==="documentacion"||table==="equipos_instalaciones"||table==="vencimientos"){
    q=q.in("organizacion_id",getOrgIds());
  }else if(table==="sectores"){
    const es=await fetchRows("establecimientos");const ids=es.map(x=>x.id);
    if(!ids.length)return [];
    q=q.in("establecimiento_id",ids);
  }else if(table==="puestos"){
    const ss=await fetchRows("sectores");const ids=ss.map(x=>x.id);
    if(!ids.length)return [];
    q=q.in("sector_id",ids);
  }else if(table==="riesgos"){
    const ps=await fetchRows("puestos");const ids=ps.map(x=>x.id);
    if(!ids.length)return [];
    q=q.in("puesto_id",ids);
  }
  const {data,error}=await q;if(error)throw error;return data||[];
}
async function fetchReferenceOptions(table){
  const labels={
    establecimientos:r=>r.Nombre,
    sectores:r=>r.nombre,
    puestos:r=>r.Nombre,
    personas:r=>`${r.Apellido||""}, ${r.Nombre||""}`.replace(/^, |, $/g,""),
    peligros:r=>r.nombre,
    inspecciones:r=>`${r.tipo||"Inspección"} — ${r.fecha||""}`,
    riesgos:r=>r.descripcion,
    hallazgos:r=>r.descripcion
  };
  const rows=await fetchRows(table);
  return rows.map(r=>({id:r.id,label:labels[table]?.(r)||r.nombre||r.titulo||r.id}));
}
async function renderField(field,value){
  const [key,label,type,required]=field;
  const req=required?"required":"";
  const id="f_"+key.replace(/[^a-zA-Z0-9_-]/g,"_");
  let control="";
  if(type==="checkbox"){
    control=`<input id="${escapeHtml(id)}" name="${escapeHtml(key)}" type="checkbox" style="width:auto;max-width:none;margin:4px 0 14px" ${value===false?"":"checked"}>`;
  }else if(type.startsWith("ref:")){
    const opts=await fetchReferenceOptions(referenceTable(field));
    control=`<select id="${escapeHtml(id)}" name="${escapeHtml(key)}" ${req}><option value="">Seleccione...</option>${opts.map(o=>`<option value="${escapeHtml(o.id)}" ${o.id===value?"selected":""}>${escapeHtml(o.label)}</option>`).join("")}</select>`;
  }else if(type.startsWith("select:")){
    const opts=type.slice(7).split(",");
    control=`<select id="${escapeHtml(id)}" name="${escapeHtml(key)}" ${req}><option value="">Seleccione...</option>${opts.map(o=>`<option ${o===value?"selected":""}>${escapeHtml(o)}</option>`).join("")}</select>`;
  }else if(type==="textarea"){
    control=`<textarea id="${escapeHtml(id)}" name="${escapeHtml(key)}" rows="3" ${req}>${escapeHtml(value||"")}</textarea>`;
  }else{
    const htmlType=type==="ref"?"text":type;
    control=`<input id="${escapeHtml(id)}" name="${escapeHtml(key)}" type="${escapeHtml(htmlType)}" value="${escapeHtml(value??"")}" ${req} ${type==="number"?'step="any"':""}>`;
  }
  return `<div class="${type==="textarea"?"field-full":""}"><label for="${escapeHtml(id)}">${escapeHtml(label)}${required?" *":""}</label>${control}</div>`;
}
function displayValue(key,value,row){
  if(value===null||value===undefined||value==="")return "—";
  if(typeof value==="boolean")return value?"Sí":"No";
  if(key==="archivo_url"&&String(value).startsWith("http")){
    return `<a href="${escapeHtml(value)}" target="_blank" rel="noopener noreferrer">Abrir archivo</a>`;
  }
  return escapeHtml(value);
}
function filterRows(rows,config){
  if(!searchText)return rows;
  const needle=searchText.toLocaleLowerCase("es");
  return rows.filter(r=>config.columns.some(k=>String(r[k]??"").toLocaleLowerCase("es").includes(needle)));
}
async function renderCrud(id){
  const cfg=configs[id];if(!cfg)return;
  editing=null;
  $("view").innerHTML=`
    <div class="page-title"><div><h2>${escapeHtml(cfg.title)}</h2><p>Registros de ${escapeHtml(getOrgName())}. Los permisos se aplican mediante Supabase.</p></div><button class="btn btn-blue" id="reloadModule">↻ Actualizar listado</button></div>
    <div class="panel"><h3 id="formTitle">Registrar ${escapeHtml(cfg.title.toLocaleLowerCase("es"))}</h3>
      <form id="recordForm"><div id="formFields" class="form-grid"></div>
      <div class="actions"><button class="btn btn-green" type="submit" id="saveRecord">Guardar registro</button><button class="btn btn-light hidden" id="cancelEdit" type="button">Cancelar edición</button></div>
      <div id="formStatus" class="status" role="status"></div></form>
    </div>
    <div class="panel"><h3>Listado</h3><div class="toolbar"><input id="tableSearch" placeholder="Buscar en los registros..." aria-label="Buscar"><span id="rowCount" class="muted"></span></div>
      <div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"><tr><td class="empty">Cargando...</td></tr></tbody></table></div>
      <div id="tableStatus" class="status" role="status"></div>
    </div>`;
  const fields=$("formFields");
  for(const f of cfg.fields)fields.insertAdjacentHTML("beforeend",await renderField(f,f[2]==="checkbox"?true:""));
  $("recordForm").onsubmit=e=>saveRecord(e,id);
  $("reloadModule").onclick=()=>loadModuleRows(id);
  $("cancelEdit").onclick=()=>{editing=null;renderCrud(id)};
  $("tableSearch").oninput=e=>{searchText=e.target.value;renderTable(id)};
  await loadModuleRows(id);
}
async function loadModuleRows(id){
  const cfg=configs[id];if(!cfg)return;
  $("tableStatus").textContent="Consultando datos...";
  try{
    const rows=await fetchRows(cfg.table);
    moduleCache[id]=rows;currentRows=rows;
    $("tableStatus").textContent=`Se encontraron ${rows.length} registro(s).`;
    renderTable(id);
  }catch(e){
    console.error(e);$("tableStatus").textContent="No se pudo consultar: "+(e.message||"Error desconocido");
    $("tableBody").innerHTML=`<tr><td colspan="20" class="empty">No se pudieron cargar los datos. Verificá la conexión y las políticas RLS.</td></tr>`;
  }
}
function renderTable(id){
  const cfg=configs[id];if(!cfg)return;
  const rows=filterRows(moduleCache[id]||[],cfg);
  $("rowCount").textContent=`${rows.length} registro(s)`;
  $("tableHead").innerHTML=`<tr>${cfg.columns.map(k=>`<th>${escapeHtml(cfg.fields.find(f=>f[0]===k)?.[1]||k)}</th>`).join("")}<th>Acciones</th></tr>`;
  const tb=$("tableBody");tb.replaceChildren();
  if(!rows.length){tb.innerHTML=`<tr><td colspan="${cfg.columns.length+1}" class="empty">No hay registros para mostrar.</td></tr>`;return}
  rows.forEach(row=>{
    const tr=document.createElement("tr");
    cfg.columns.forEach(k=>{
      const td=document.createElement("td");
      const f=cfg.fields.find(x=>x[0]===k);
      const value=row[k];
      if(f?.[2]==="checkbox"||typeof value==="boolean"){
        td.innerHTML=`<span class="badge ${value?"ok":"off"}">${value?"Sí":"No"}</span>`;
      }else if(k==="archivo_url"&&value&&String(value).startsWith("http")){
        td.innerHTML=`<a href="${escapeHtml(value)}" target="_blank" rel="noopener noreferrer">Abrir</a>`;
      }else td.textContent=value===null||value===undefined||value===""?"—":String(value);
      tr.appendChild(td);
    });
    const td=document.createElement("td");
    td.append(
      makeButton("Editar","btn btn-light btn-sm",()=>startEdit(id,row)),
      makeButton("Eliminar","btn btn-red btn-sm",()=>deleteRecord(id,row))
    );
    tr.appendChild(td);tb.appendChild(tr);
  });
}
function makeButton(text,cls,fn){
  const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=text;b.onclick=fn;return b;
}
async function startEdit(id,row){
  editing=row;
  await renderCrud(id);
  editing=row;
  $("formTitle").textContent="Editar registro";
  $("saveRecord").textContent="Guardar cambios";
  $("cancelEdit").classList.remove("hidden");
  for(const f of configs[id].fields){
    const el=$("f_"+f[0].replace(/[^a-zA-Z0-9_-]/g,"_"));
    if(!el)continue;
    if(f[2]==="checkbox")el.checked=row[f[0]]!==false;
    else el.value=row[f[0]]??"";
  }
  $("recordForm").onsubmit=e=>saveRecord(e,id);
  $("formTitle").scrollIntoView({behavior:"smooth",block:"start"});
}
async function saveRecord(ev,id){
  ev.preventDefault();
  const cfg=configs[id],form=$("recordForm"),b=$("saveRecord");
  b.disabled=true;$("formStatus").textContent="Guardando...";
  try{
    const payload={};
    for(const f of cfg.fields){
      const key=f[0],el=$("f_"+key.replace(/[^a-zA-Z0-9_-]/g,"_"));
      if(!el)continue;
      if(f[2]==="checkbox")payload[key]=el.checked;
      else{
        const val=el.value.trim();
        payload[key]=val===""?null:(f[2]==="number"?Number(val):val);
      }
    }
    if(cfg.org){
      if(!activeOrg)throw new Error("No hay organización seleccionada.");
      if(!editing)payload.organizacion_id=activeOrg;
    }else if(id==="sectores"||id==="puestos"){
      // La pertenencia a la organización se verifica a través de las relaciones y las políticas RLS.
    }
    let result;
    if(editing){
      result=await db.from(cfg.table).update(payload).eq("id",editing.id).select("id");
    }else{
      result=await db.from(cfg.table).insert(payload).select("id");
    }
    if(result.error)throw result.error;
    if(!result.data?.length)throw new Error("No se confirmó la operación. Verificá permisos RLS y organización activa.");
    editing=null;
    await renderCrud(id);
    $("formStatus").textContent="Registro guardado correctamente.";
  }catch(e){
    console.error(e);$("formStatus").textContent="No se pudo guardar: "+(e.message||"Error desconocido");
    $("formStatus").className="status error";
  }finally{b.disabled=false}
}
async function deleteRecord(id,row){
  const cfg=configs[id];
  const label=row.Nombre||row.nombre||row.titulo||row.concepto||row.descripcion||row.id;
  if(!confirm(`¿Querés eliminar el registro "${label}"? Esta acción puede ser irreversible.`))return;
  try{
    const {error}=await db.from(cfg.table).delete().eq("id",row.id);
    if(error)throw error;
    await loadModuleRows(id);
  }catch(e){
    console.error(e);alert("No se pudo eliminar el registro: "+(e.message||"Error desconocido"));
  }
}

    console.error(e);$("homeStatus").textContent="No se pudieron cargar todos los indicadores: "+(e.message||"Error");

async function initialize(){
  const {data,error}=await db.auth.getUser();
  if(error)throw error;
  user=data.user;
  if(!user)throw new Error("No hay una sesión activa.");
  const {data:members,error:me}=await db.from("usuarios_organizaciones")
    .select("organizacion_id, rol").eq("usuario_id",user.id).eq("activo",true);
  if(me)throw me;
  const ids=[...new Set((members||[]).map(x=>x.organizacion_id).filter(Boolean))];
  if(!ids.length)throw new Error("Tu usuario no tiene una organización activa asignada.");
  const {data:orgs,error:oe}=await db.from("organizaciones").select("id,nombre").in("id",ids);
  if(oe)throw oe;
  organizations=orgs||[];
  if(!organizations.length)throw new Error("No se encontraron organizaciones autorizadas.");
  activeOrg=organizations[0].id;
  const select=$("orgSelect");select.replaceChildren();
  organizations.forEach(o=>{
    const op=document.createElement("option");op.value=o.id;op.textContent=o.nombre||"Organización";
    select.appendChild(op);
  });
  select.value=activeOrg;
  select.onchange=()=>{activeOrg=select.value;moduleCache={};openModule(activeModule)};
  showApp();buildNav();await renderHome();
}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();const b=$("loginButton");b.disabled=true;b.textContent="Ingresando...";
  $("loginMessage").textContent="";
  try{
    const {error}=await db.auth.signInWithPassword({
      email:$("email").value.trim(),password:$("password").value
    });
    if(error)throw error;
    await initialize();
  }catch(e){
    console.error(e);showLogin("No se pudo iniciar sesión: "+(e.message||"Error desconocido"));
  }finally{b.disabled=false;b.textContent="Ingresar"}
});
$("logoutButton").addEventListener("click",async()=>{
  const {error}=await db.auth.signOut();
  if(error){alert("No se pudo cerrar sesión: "+error.message);return}
  user=null;organizations=[];activeOrg="";moduleCache={};showLogin();
});
$("refreshAll").addEventListener("click",()=>{
  moduleCache={};openModule(activeModule);
});
db.auth.getSession().then(async({data,error})=>{
  if(error){showLogin("No se pudo verificar la sesión.");return}
  if(data.session){
    try{await initialize()}catch(e){console.error(e);showLogin("No se pudo iniciar la aplicación: "+e.message)}
  }else showLogin();
});
db.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT")showLogin();
});
