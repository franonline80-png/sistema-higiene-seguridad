<style>
:root{--navy:#10243a;--navy2:#1d4d70;--blue:#2563eb;--bg:#f3f6fa;--text:#172033;--muted:#64748b;--line:#e2e8f0;--green:#15803d;--red:#b91c1c;--amber:#a16207}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.hidden{display:none!important}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#10243a,#245477)}
.login-box{width:100%;max-width:430px;background:#fff;padding:32px;border-radius:18px;box-shadow:0 20px 60px #0003}
.brand-mark{width:54px;height:54px;border-radius:14px;background:#e6efff;color:#1d4ed8;display:grid;place-items:center;font-size:26px;margin-bottom:20px}
.login-box h1{font-size:25px;margin:0 0 8px}
.login-box p{color:var(--muted);line-height:1.5;margin:0 0 24px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
input,select,textarea{width:100%;min-width:0;border:1px solid #cbd5e1;background:#fff;padding:10px 12px;border-radius:8px;margin-bottom:14px;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;border-color:#3b82f6}
.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--navy);color:white;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn-blue{background:var(--blue)}.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-light{background:#e8eef5;color:#203247}.btn-sm{padding:6px 9px;font-size:12px;margin:2px}
#loginButton{width:100%;padding:13px}
#loginMessage,.status{font-size:13px;line-height:1.5;margin-top:10px;overflow-wrap:anywhere}
.error{color:var(--red)}.success{color:var(--green)}.muted{color:var(--muted)}
#app{display:none}
.topbar{background:var(--navy);color:#fff;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.brand-icon{height:45px;width:45px;display:grid;place-items:center;border-radius:12px;background:#244762;font-size:23px}
.brand h1{font-size:19px;margin:0 0 5px}.brand p{font-size:12px;color:#cbd5e1;margin:0}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.org-select{min-width:220px;max-width:320px;margin:0}
.layout{max-width:1600px;margin:auto;padding:22px}
.nav-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:18px;scrollbar-width:thin}
.nav-tab{flex:0 0 auto;border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#fff;color:#334155;font-size:13px;font-weight:700}
.nav-tab.active{background:var(--navy);color:white;border-color:var(--navy)}
.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-title h2{margin:0 0 6px;font-size:25px}.page-title p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.metric,.panel{background:#fff;border:1px solid #e7edf4;border-radius:13px;padding:18px;box-shadow:0 2px 7px #0f172a08}
.metric-label{color:var(--muted);font-size:12px;font-weight:700;margin-bottom:10px}.metric-value{font-size:29px;font-weight:800}.metric-icon{float:right;font-size:23px}
.panel{margin-bottom:18px}.panel h3{font-size:16px;margin:0 0 14px}.panel p{line-height:1.6}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.field-full{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.toolbar input,.toolbar select{max-width:300px;margin:0}
.table-wrap{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13px;background:white}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:normal;max-width:280px;overflow-wrap:anywhere}
th{position:sticky;top:0;background:#f8fafc;color:#475569;z-index:1;font-size:12px}
tr:hover td{background:#fafcff}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:#e2e8f0;color:#334155}
.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.off{background:#fee2e2;color:#991b1b}
.notice{padding:12px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;font-size:13px;line-height:1.6;margin-bottom:14px}
.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.module-card{border:1px solid var(--line);background:#fff;padding:17px;border-radius:12px;text-align:left;color:var(--text)}
.module-card:hover{border-color:#93c5fd;box-shadow:0 5px 15px #1e3a8a0c}
.module-card .ico{font-size:23px;margin-bottom:12px}.module-card strong{display:block;margin-bottom:6px}.module-card span{color:var(--muted);font-size:12px;line-height:1.5}
.legal-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.legal-link{padding:15px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text);background:#fff;display:block}
.legal-link strong{display:block;margin-bottom:6px}.legal-link span{color:var(--muted);font-size:12px;line-height:1.5}
.empty{padding:22px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}

/* TABLERO PROFESIONAL */
.dashboard-welcome{background:linear-gradient(120deg,#10243a 0%,#1d4d70 100%);color:white;border-radius:17px;padding:25px 27px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:18px;box-shadow:0 8px 24px #10243a18}
.dashboard-welcome h2{font-size:25px;margin:0 0 8px}
.dashboard-welcome p{color:#dbeafe;margin:0;font-size:14px;line-height:1.6}
.dashboard-date{font-size:12px;color:#dbeafe;margin-top:13px}
.dashboard-section-title{font-size:17px;font-weight:800;margin:24px 0 13px}
.dashboard-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.dashboard-metric{background:#fff;border:1px solid #e5ebf2;border-radius:14px;padding:18px;min-width:0;box-shadow:0 3px 12px #0f172a06;position:relative;overflow:hidden}
.dashboard-metric:after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#2563eb}
.dashboard-metric:nth-child(2):after{background:#0891b2}
.dashboard-metric:nth-child(3):after{background:#7c3aed}

.dashboard-metric-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.dashboard-metric-label{font-size:12px;color:#64748b;font-weight:700}
.dashboard-metric-icon{width:38px;height:38px;display:grid;place-items:center;background:#eff6ff;border-radius:11px;font-size:19px}
.dashboard-metric-number{font-size:31px;font-weight:800;letter-spacing:-1px;margin-top:13px}
.dashboard-metric-foot{font-size:11px;color:#64748b;margin-top:5px}
.dashboard-two-columns{display:grid;grid-template-columns:1fr 1fr;gap:17px;align-items:start}
.dashboard-card{background:#fff;border:1px solid #e5ebf2;border-radius:14px;padding:18px;min-width:0;box-shadow:0 3px 12px #0f172a06}
.dashboard-card-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.dashboard-card-heading h3{font-size:15px;margin:0}
.dashboard-count{background:#eff6ff;color:#1d4ed8;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}
.dashboard-alert-list{display:flex;flex-direction:column;gap:9px}
.dashboard-alert{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid #edf1f5;border-radius:10px;background:#fff}
.dashboard-alert-symbol{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:#f1f5f9;font-size:16px}
.dashboard-alert-symbol.red{background:#fee2e2}
.dashboard-alert-symbol.amber{background:#fef3c7}
.dashboard-alert-symbol.blue{background:#dbeafe}
.dashboard-alert-content{flex:1;min-width:0}
.dashboard-alert-title{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.dashboard-alert-detail{font-size:12px;color:#64748b;line-height:1.5;margin-top:4px;overflow-wrap:anywhere}
.dashboard-alert-meta{font-size:11px;color:#64748b;margin-top:5px}
.dashboard-empty{padding:20px 10px;text-align:center;color:#64748b;font-size:13px;line-height:1.6}
.dashboard-shortcuts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}

.dashboard-shortcut-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:11px;background:#eff6ff;font-size:20px;margin-bottom:11px}
.dashboard-shortcut strong{display:block;font-size:13px;margin-bottom:5px}
.dashboard-shortcut span{font-size:11px;color:#64748b;line-height:1.5}
.dashboard-refresh-note{font-size:11px;color:#64748b;margin-top:12px}
.dashboard-loading{padding:22px;color:#64748b;font-size:13px}

</style>
</head>

async function fetchRows(table,limit=500){
  let q=db.from(table).select("*").limit(limit);
  if(table==="organizaciones")q=q.in("id",getOrgIds());
  else if(["establecimientos","personas","accidentes_incidentes","inspecciones","mediciones_ambientales","epp","capacitaciones","documentacion","equipos_instalaciones","vencimientos"].includes(table))q=q.in("organizacion_id",getOrgIds());
  else if(table==="sectores"){
    const es=await fetchRows("establecimientos");const ids=es.map(x=>x.id);if(!ids.length)return [];q=q.in("establecimiento_id",ids);
  }else if(table==="puestos"){
    const ss=await fetchRows("sectores");const ids=ss.map(x=>x.id);if(!ids.length)return [];q=q.in("sector_id",ids);
  }else if(table==="riesgos"){
    const ps=await fetchRows("puestos");const ids=ps.map(x=>x.id);if(!ids.length)return [];q=q.in("puesto_id",ids);
  }
  const {data,error}=await q;if(error)throw error;return data||[];
}
async function fetchReferenceOptions(table){
  const labels={
    establecimientos:r=>r.Nombre,sectores:r=>r.nombre,puestos:r=>r.Nombre,
    personas:r=>`${r.Apellido||""}, ${r.Nombre||""}`.replace(/^, |, $/g,""),
    peligros:r=>r.nombre,inspecciones:r=>`${r.tipo||"Inspección"} — ${r.fecha||""}`,
    riesgos:r=>r.descripcion,hallazgos:r=>r.descripcion
  };
  const rows=await fetchRows(table);
  return rows.map(r=>({id:r.id,label:labels[table]?.(r)||r.nombre||r.titulo||r.id}));
}
async function renderField(field,value){
  const [key,label,type,required]=field,req=required?"required":"";
  const id="f_"+key.replace(/[^a-zA-Z0-9_-]/g,"_");
  let control="";
  if(type==="checkbox")control=`<input id="${id}" name="${escapeHtml(key)}" type="checkbox" style="width:auto;margin:4px 0 14px" ${value===false?"":"checked"}>`;
  else if(type.startsWith("ref:")){
    const opts=await fetchReferenceOptions(type.split(":")[1]);
    control=`<select id="${id}" name="${escapeHtml(key)}" ${req}><option value="">Seleccione...</option>${opts.map(o=>`<option value="${escapeHtml(o.id)}" ${o.id===value?"selected":""}>${escapeHtml(o.label)}</option>`).join("")}</select>`;
  }else if(type.startsWith("select:")){
    control=`<select id="${id}" name="${escapeHtml(key)}" ${req}><option value="">Seleccione...</option>${type.slice(7).split(",").map(o=>`<option value="${escapeHtml(o)}" ${o===value?"selected":""}>${escapeHtml(o)}</option>`).join("")}</select>`;
  }else if(type==="textarea")control=`<textarea id="${id}" name="${escapeHtml(key)}" rows="3" ${req}>${escapeHtml(value||"")}</textarea>`;
  else control=`<input id="${id}" name="${escapeHtml(key)}" type="${escapeHtml(type)}" value="${escapeHtml(value??"")}" ${req} ${type==="number"?'step="any"':""}>`;
  return `<div class="${type==="textarea"?"field-full":""}"><label for="${id}">${escapeHtml(label)}${required?" *":""}</label>${control}</div>`;
}

let bulkPeopleRows=[],bulkPeopleValid=[],bulkPeopleEstablishments=[];
async function ensureXLSX(){
  if(window.XLSX)return window.XLSX;
  if(window.__xlsxLoading)return window.__xlsxLoading;
  window.__xlsxLoading=new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload=()=>window.XLSX?resolve(window.XLSX):reject(new Error("No se pudo cargar la librería Excel."));
    s.onerror=()=>reject(new Error("No se pudo cargar la librería Excel. Verificá la conexión a Internet."));
    document.head.appendChild(s);
  });
  return window.__xlsxLoading;
}
function bulkNorm(v){return String(v??"").trim().toLocaleLowerCase("es-AR").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ")}
function bulkCell(row,names){
  const keys=Object.keys(row||{});
  for(const n of names){const k=keys.find(x=>bulkNorm(x)===bulkNorm(n));if(k!==undefined)return row[k]}
  return "";
}
function bulkDate(value,XLSX){
  if(value===null||value===undefined||value==="")return null;
  if(value instanceof Date&&!Number.isNaN(value.getTime()))return `${value.getFullYear()}-${String(value.getMonth()+1).padStart(2,"0")}-${String(value.getDate()).padStart(2,"0")}`;
  if(typeof value==="number"&&Number.isFinite(value)){
    const d=XLSX.SSF.parse_date_code(value);
    if(d)return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
  }
  const s=String(value).trim();
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
  if(m)return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  return "__FECHA_INVALIDA__";
}
function bulkBool(value){
  if(value===null||value===undefined||String(value).trim()==="")return true;
  const v=bulkNorm(value);
  if(["si","s","true","1","activo","verdadero","yes"].includes(v))return true;
  if(["no","false","0","inactivo","falso"].includes(v))return false;
  return null;
}

async function bulkValidateFile(){
  const status=$("bulkStatus"),file=$("bulkFile").files?.[0],estId=$("bulkEstablishment").value;
  $("bulkConfirm").disabled=true;bulkPeopleRows=[];bulkPeopleValid=[];
  if(!estId){status.textContent="Seleccioná primero un establecimiento.";return}
  if(!bulkPeopleEstablishments.some(e=>e.id===estId&&e.organizacion_id===activeOrg)){status.textContent="El establecimiento seleccionado no pertenece a la organización activa.";return}
  if(!file){status.textContent="Seleccioná un archivo .xlsx.";return}
  if(!/\.xlsx$/i.test(file.name)){status.textContent="El archivo debe tener formato .xlsx.";return}
  status.textContent="Leyendo y validando el archivo...";
  try{
    const X=await ensureXLSX(),buf=await file.arrayBuffer(),wb=X.read(buf,{type:"array",cellDates:true});
    const sheet=wb.Sheets[wb.SheetNames[0]];
    if(!sheet)throw new Error("El archivo no contiene una hoja de datos.");
    const raw=X.utils.sheet_to_json(sheet,{defval:"",raw:true});
    if(!raw.length)throw new Error("La primera hoja no contiene filas de datos.");
    const headers=Object.keys(raw[0]).map(bulkNorm);
    const required=["nombre","apellido","puesto"];
    const missing=required.filter(h=>!headers.includes(h));
    if(missing.length)throw new Error("Faltan encabezados obligatorios: "+missing.join(", ")+". Usá la plantilla descargada desde el sistema.");
    const [estRows,secRows,puestoRows,personaRows]=await Promise.all([fetchRows("establecimientos"),fetchRows("sectores"),fetchRows("puestos"),fetchRows("personas")]);
    const est=estRows.find(e=>e.id===estId&&e.organizacion_id===activeOrg);
    if(!est)throw new Error("No se pudo verificar el establecimiento en la organización activa.");
    const sectorIds=new Set(secRows.filter(s=>s.establecimiento_id===estId).map(s=>s.id));
    const posts=puestoRows.filter(p=>sectorIds.has(p.sector_id)&&p.Activo!==false&&p.activo!==false);
    const people=personaRows.filter(p=>p.organizacion_id===activeOrg);
    const seenDocs=new Set(),seenLegajos=new Set();
    const existingDocs=new Set(people.map(p=>bulkNorm(p.Documneto)).filter(Boolean));
    const existingLegajos=new Set(people.map(p=>bulkNorm(p.Legajo)).filter(Boolean));
    const output=[];
    raw.forEach((r,i)=>{
      if(Object.values(r).every(v=>String(v??"").trim()===""))return;
      const errors=[],nombre=String(bulkCell(r,["Nombre"] )??"").trim(),apellido=String(bulkCell(r,["Apellido"])??"").trim();
      const legajo=String(bulkCell(r,["Legajo"])??"").trim(),documento=String(bulkCell(r,["Documento","Documneto","Documento"])??"").trim();
      const cargo=String(bulkCell(r,["Cargo"])??"").trim(),puestoTexto=String(bulkCell(r,["Puesto"])??"").trim();
      const fecha=bulkDate(bulkCell(r,["Fecha de Ingreso","Fecha de ingreso"]),X),activo=bulkBool(bulkCell(r,["Activo"]));
      if(!nombre)errors.push("Falta Nombre");
      if(!apellido)errors.push("Falta Apellido");
      if(!puestoTexto)errors.push("Falta Puesto");
      if(fecha==="__FECHA_INVALIDA__")errors.push("Fecha inválida");
      if(activo===null)errors.push("Activo debe ser Sí o No");
      const matches=posts.filter(p=>bulkNorm(p.Nombre)===bulkNorm(puestoTexto));
      if(puestoTexto&&matches.length===0)errors.push("Puesto no existe en el establecimiento");
      if(matches.length>1)errors.push("Puesto ambiguo: hay varios con ese nombre");
      if(documento){const k=bulkNorm(documento);if(existingDocs.has(k)||seenDocs.has(k))errors.push("Documento duplicado");seenDocs.add(k)}
      if(legajo){const k=bulkNorm(legajo);if(existingLegajos.has(k)||seenLegajos.has(k))errors.push("Legajo duplicado");seenLegajos.add(k)}
      const p=matches.length===1?matches[0]:null;
      output.push({rowNo:i+2,legajo,nombre,apellido,documento,cargo,fecha:fecha==="__FECHA_INVALIDA__"?null:fecha,puestoTexto,puestoId:p?.id||null,activo:activo===null?true:activo,errors});
    });
    if(!output.length)throw new Error("No se encontraron filas con datos.");
    bulkPeopleRows=output;bulkPeopleValid=output.filter(r=>!r.errors.length);
    bulkShowPreview(output);
    status.textContent=bulkPeopleValid.length?"Validación terminada. Revisá los resultados; las filas con errores no se guardarán.":"La validación terminó, pero no hay filas válidas para importar.";
  }catch(e){console.error(e);status.textContent="No se pudo validar: "+e.message;$("bulkSummary").innerHTML="";$("bulkPreview").innerHTML="";}
}
async function bulkConfirmImport(){
  const rows=bulkPeopleValid.filter(r=>!r.errors.length),estId=$("bulkEstablishment").value;
  if(!rows.length||!estId)return;
  if(!confirm(`Se van a dar de alta ${rows.length} persona(s) en el establecimiento seleccionado. Solo se procesarán las filas válidas. ¿Confirmás la operación?`))return;
  const button=$("bulkConfirm"),status=$("bulkStatus");button.disabled=true;status.textContent="Guardando registros...";
  let inserted=0;
  try{
    for(let i=0;i<rows.length;i+=50){
      const batch=rows.slice(i,i+50).map(r=>({
        organizacion_id:activeOrg,Legajo:r.legajo||null,Nombre:r.nombre,Apellido:r.apellido,
        Documneto:r.documento||null,Cargo:r.cargo||null,"Fecha de Ingreso":r.fecha,
        puesto_id:r.puestoId,Activo:r.activo
      }));
      const {error}=await db.from("personas").insert(batch);
      if(error)throw new Error(`Se guardaron ${inserted} registro(s), pero falló el siguiente lote: ${error.message}`);
      inserted+=batch.length;
    }
    status.textContent=`Importación finalizada: ${inserted} persona(s) dadas de alta.`;
    bulkPeopleRows=[];bulkPeopleValid=[];$("bulkSummary").innerHTML="";$("bulkPreview").innerHTML="";$("bulkFile").value="";
    await loadModuleRows("personas");
  }catch(e){console.error(e);status.textContent="Resultado de la importación: "+e.message;}
  finally{button.disabled=false}
}

  const cfg=configs[id],rows=(moduleCache[id]||[]).filter(r=>!searchText||cfg.columns.some(k=>String(r[k]??"").toLowerCase().includes(searchText.toLowerCase())));
  $("rowCount").textContent=`${rows.length} registro(s)`;
  $("tableHead").innerHTML=`<tr>${cfg.columns.map(k=>`<th>${escapeHtml(cfg.fields.find(f=>f[0]===k)?.[1]||k)}</th>`).join("")}<th>Acciones</th></tr>`;
  const tb=$("tableBody");tb.replaceChildren();
  if(!rows.length){tb.innerHTML=`<tr><td colspan="${cfg.columns.length+1}" class="empty">No hay registros para mostrar.</td></tr>`;return}
  rows.forEach(row=>{
    const tr=document.createElement("tr");
    cfg.columns.forEach(k=>{
      const td=document.createElement("td"),v=row[k];
      if(typeof v==="boolean")td.innerHTML=`<span class="badge ${v?"ok":"off"}">${v?"Sí":"No"}</span>`;
      else if(k==="archivo_url"&&v&&String(v).startsWith("http"))td.innerHTML=`<a href="${escapeHtml(v)}" target="_blank" rel="noopener noreferrer">Abrir</a>`;
      else td.textContent=v===null||v===undefined||v===""?"—":String(v);
      tr.appendChild(td);
    });
    const td=document.createElement("td");td.append(makeButton("Editar","btn btn-light btn-sm",()=>startEdit(id,row)),makeButton("Eliminar","btn btn-red btn-sm",()=>deleteRecord(id,row)));tr.appendChild(td);tb.appendChild(tr);
  });
}
function makeButton(text,cls,fn){const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=text;b.onclick=fn;return b}
async function startEdit(id,row){
  await renderCrud(id);editing=row;$("formTitle").textContent="Editar registro";$("saveRecord").textContent="Guardar cambios";$("cancelEdit").classList.remove("hidden");
  for(const f of configs[id].fields){const el=$("f_"+f[0].replace(/[^a-zA-Z0-9_-]/g,"_"));if(!el)continue;if(f[2]==="checkbox")el.checked=row[f[0]]!==false;else el.value=row[f[0]]??""}
}
async function saveRecord(ev,id){
  ev.preventDefault();const cfg=configs[id],b=$("saveRecord");b.disabled=true;$("formStatus").textContent="Guardando...";
  try{
    const payload={};
    for(const f of cfg.fields){
      const el=$("f_"+f[0].replace(/[^a-zA-Z0-9_-]/g,"_"));if(!el)continue;
      if(f[2]==="checkbox")payload[f[0]]=el.checked;
      else{const v=el.value.trim();payload[f[0]]=v===""?null:(f[2]==="number"?Number(v):v)}
    }
    if(cfg.org&&!editing)payload.organizacion_id=activeOrg;
    const result=editing?await db.from(cfg.table).update(payload).eq("id",editing.id).select("id"):await db.from(cfg.table).insert(payload).select("id");
    if(result.error)throw result.error;
    if(!result.data?.length)throw new Error("No se confirmó la operación. Verificá los permisos RLS.");
    editing=null;await renderCrud(id);
  }catch(e){console.error(e);$("formStatus").textContent="No se pudo guardar: "+e.message;$("formStatus").className="status error"}
  finally{b.disabled=false}
}
async function deleteRecord(id,row){
  const name=row.Nombre||row.nombre||row.titulo||row.concepto||row.descripcion||row.id;
  if(!confirm(`¿Querés eliminar el registro "${name}"? Esta acción puede ser irreversible.`))return;
  try{const {error}=await db.from(configs[id].table).delete().eq("id",row.id);if(error)throw error;await loadModuleRows(id)}
  catch(e){alert("No se pudo eliminar: "+e.message)}
}

/* TABLERO DE CONTROL */
async function renderHome(){
  const view=$("view");
  const fechaLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const hoy=fechaLocal(new Date()),limite=new Date();limite.setDate(limite.getDate()+30);
  const fechaLimite=fechaLocal(limite);
  const fechaLegible=v=>{if(!v)return "Sin fecha";const p=String(v).slice(0,10).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(v)};
  const diasHasta=v=>{if(!v)return null;const a=new Date(hoy+"T12:00:00"),b=new Date(String(v).slice(0,10)+"T12:00:00");return Number.isNaN(b.getTime())?null:Math.round((b-a)/86400000)};
  const estadoTexto=v=>String(v||"").trim().toLowerCase();
  const esCerrado=v=>["cerrado","cerrada","resuelto","resuelta","finalizado","finalizada","completado","completada","cumplido"].includes(estadoTexto(v));
  const alertaHTML=(icono,color,titulo,detalle,meta="")=>`<div class="dashboard-alert"><div class="dashboard-alert-symbol ${color}">${icono}</div><div class="dashboard-alert-content"><div class="dashboard-alert-title">${escapeHtml(titulo)}</div><div class="dashboard-alert-detail">${escapeHtml(detalle||"Sin descripción")}</div>${meta?`<div class="dashboard-alert-meta">${escapeHtml(meta)}</div>`:""}</div></div>`;
  const listaHTML=(items,vacio)=>items.length?items.join(""):`<div class="dashboard-empty">✓ ${escapeHtml(vacio)}</div>`;

  view.innerHTML=`
  <section class="dashboard-welcome"><div><h2>Tablero de control</h2><p>Gestión preventiva de Higiene y Seguridad.<br>Consultá indicadores, prioridades y actividades de la organización.</p><div class="dashboard-date">📅 ${escapeHtml(new Date().toLocaleDateString("es-AR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}))}</div></div><button id="dashboardRefresh" class="btn btn-light" type="button">↻ Actualizar</button></section>
  <div class="dashboard-section-title">Resumen de la organización</div>
  <section class="dashboard-metrics">
    <div class="dashboard-metric"><div class="dashboard-metric-top"><span class="dashboard-metric-label">Establecimientos activos</span><span class="dashboard-metric-icon">▦</span></div><div class="dashboard-metric-number" id="dashEst">—</div><div class="dashboard-metric-foot">Instalaciones activas</div></div>
    <div class="dashboard-metric"><div class="dashboard-metric-top"><span class="dashboard-metric-label">Sectores activos</span><span class="dashboard-metric-icon">▤</span></div><div class="dashboard-metric-number" id="dashSec">—</div><div class="dashboard-metric-foot">Sectores de trabajo</div></div>
    <div class="dashboard-metric"><div class="dashboard-metric-top"><span class="dashboard-metric-label">Puestos activos</span><span class="dashboard-metric-icon">▣</span></div><div class="dashboard-metric-number" id="dashPue">—</div><div class="dashboard-metric-foot">Puestos registrados</div></div>
    <div class="dashboard-metric"><div class="dashboard-metric-top"><span class="dashboard-metric-label">Personas activas</span><span class="dashboard-metric-icon">♙</span></div><div class="dashboard-metric-number" id="dashPer">—</div><div class="dashboard-metric-foot">Personal registrado</div></div>
  </section>
  <div class="dashboard-section-title">Seguimiento preventivo</div>
  <section class="dashboard-two-columns">
    <div class="dashboard-card"><div class="dashboard-card-heading"><h3>⏰ Vencimientos y prioridades</h3><span class="dashboard-count" id="dashVencCount">—</span></div><div id="dashVencList" class="dashboard-alert-list"><div class="dashboard-loading">Consultando vencimientos...</div></div><div class="actions"><button class="btn btn-light btn-sm" data-goto="vencimientos">Ver vencimientos →</button></div></div>
    <div class="dashboard-card"><div class="dashboard-card-heading"><h3>⚠ Accidentes e incidentes abiertos</h3><span class="dashboard-count" id="dashAccCount">—</span></div><div id="dashAccList" class="dashboard-alert-list"><div class="dashboard-loading">Consultando accidentes...</div></div><div class="actions"><button class="btn btn-light btn-sm" data-goto="accidentes_incidentes">Ver registros →</button></div></div>
    <div class="dashboard-card"><div class="dashboard-card-heading"><h3>🎓 Capacitaciones próximas</h3><span class="dashboard-count" id="dashCapCount">—</span></div><div id="dashCapList" class="dashboard-alert-list"><div class="dashboard-loading">Consultando capacitaciones...</div></div><div class="actions"><button class="btn btn-light btn-sm" data-goto="capacitaciones">Ver capacitaciones →</button></div></div>
    <div class="dashboard-card"><div class="dashboard-card-heading"><h3>🔎 Inspecciones pendientes</h3><span class="dashboard-count" id="dashInspCount">—</span></div><div id="dashInspList" class="dashboard-alert-list"><div class="dashboard-loading">Consultando inspecciones...</div></div><div class="actions"><button class="btn btn-light btn-sm" data-goto="inspecciones">Ver inspecciones →</button></div></div>
  </section>
  <div class="dashboard-section-title">Accesos rápidos</div><section class="dashboard-shortcuts" id="dashShortcuts"></section>
  <div id="dashStatus" class="dashboard-refresh-note" role="status">Consultando datos de Supabase...</div>`;

  $("dashboardRefresh").onclick=()=>{moduleCache={};renderHome()};
  view.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>openModule(b.dataset.goto));
  const shortcuts=[
    ["establecimientos","▦","Establecimientos","Administrar instalaciones"],
    ["personas","♙","Personas","Registrar y consultar personal"],
    ["riesgos","⚠","Evaluación de riesgos","Peligros y medidas preventivas"],
    ["inspecciones","✓","Inspecciones","Registrar recorridas"],
    ["accidentes_incidentes","✚","Accidentes e incidentes","Investigar y hacer seguimiento"],
    ["capacitaciones","▧","Capacitaciones","Planificar actividades"],
    ["epp","⛑","Elementos de protección","Controlar EPP"],
    ["documentacion","▤","Documentación","Consultar documentación"],
    ["vencimientos","◷","Vencimientos","Controlar fechas límite"],
    ["legislacion","§","Legislación","Consultar fuentes oficiales"]
  ];
  shortcuts.forEach(([id,icon,title,desc])=>{
    const b=document.createElement("button");b.type="button";b.className="dashboard-shortcut";
    b.innerHTML=`<div class="dashboard-shortcut-icon">${escapeHtml(icon)}</div><strong>${escapeHtml(title)}</strong><span>${escapeHtml(desc)}</span>`;
    b.onclick=()=>openModule(id);$("dashShortcuts").appendChild(b);
  });

  try{
    const [estAll,secAll,puestoAll,personasAll,vencAll,accAll,capAll,inspAll]=await Promise.all([
      fetchRows("establecimientos"),fetchRows("sectores"),fetchRows("puestos"),fetchRows("personas"),
      fetchRows("vencimientos"),fetchRows("accidentes_incidentes"),fetchRows("capacitaciones"),fetchRows("inspecciones")
    ]);
    if(activeModule!=="inicio")return;

    const est=estAll.filter(r=>r.organizacion_id===activeOrg);
    const estIds=new Set(est.map(r=>r.id));
    const sec=secAll.filter(r=>estIds.has(r.establecimiento_id));
    const secIds=new Set(sec.map(r=>r.id));
    const puestos=puestoAll.filter(r=>secIds.has(r.sector_id));
    const personas=personasAll.filter(r=>r.organizacion_id===activeOrg);

    $("dashEst").textContent=est.filter(r=>r.Activo===true).length;
    $("dashSec").textContent=sec.filter(r=>r.activo===true).length;
    $("dashPue").textContent=puestos.filter(r=>r.Activo===true).length;
    $("dashPer").textContent=personas.filter(r=>r.Activo===true).length;

    const venc=vencAll.filter(r=>r.organizacion_id===activeOrg)
      .filter(r=>!["cumplido","cerrado"].includes(estadoTexto(r.estado))&&r.fecha_vencimiento&&r.fecha_vencimiento<=fechaLimite)
      .sort((a,b)=>String(a.fecha_vencimiento).localeCompare(String(b.fecha_vencimiento)));
    $("dashVencCount").textContent=venc.length;
    $("dashVencList").innerHTML=listaHTML(venc.slice(0,5).map(r=>{
      const d=diasHasta(r.fecha_vencimiento),color=d<0?"red":d<=7?"amber":"blue";
      const plazo=d<0?`Vencido hace ${Math.abs(d)} día(s)`:d===0?"Vence hoy":d===1?"Vence mañana":`En ${d} días`;
      return alertaHTML(d<0?"!":"◷",color,r.concepto||r.tipo||"Vencimiento",r.descripcion||r.tipo||"Sin descripción",`${fechaLegible(r.fecha_vencimiento)} · ${plazo} · ${r.prioridad||"Prioridad no indicada"}`);
    }),"No hay vencimientos próximos registrados.");

    const accidentes=accAll.filter(r=>r.organizacion_id===activeOrg&&!esCerrado(r.estado)).sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||"")));
    $("dashAccCount").textContent=accidentes.length;
    $("dashAccList").innerHTML=listaHTML(accidentes.slice(0,5).map(r=>alertaHTML("⚠","red",`${r.tipo||"Accidente/incidente"} · ${fechaLegible(r.fecha)}`,r.descripcion||r.lugar||"Sin descripción registrada",`Estado: ${r.estado||"Sin estado"}`)),"No hay accidentes o incidentes abiertos registrados.");

    const caps=capAll.filter(r=>r.organizacion_id===activeOrg&&r.fecha&&r.fecha>=hoy&&r.fecha<=fechaLimite).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
    $("dashCapCount").textContent=caps.length;
    $("dashCapList").innerHTML=listaHTML(caps.slice(0,5).map(r=>alertaHTML("🎓","blue",r.titulo||"Capacitación",`${r.tipo||"Tipo no especificado"}${r.duracion_horas?" · "+r.duracion_horas+" horas":""}`,`${fechaLegible(r.fecha)}${r.instructor?" · "+r.instructor:""}`)),"No hay capacitaciones programadas para los próximos 30 días.");

    const inspecciones=inspAll.filter(r=>r.organizacion_id===activeOrg&&!esCerrado(r.estado)).sort((a,b)=>String(a.fecha||"").localeCompare(String(b.fecha||"")));
    $("dashInspCount").textContent=inspecciones.length;
    $("dashInspList").innerHTML=listaHTML(inspecciones.slice(0,5).map(r=>alertaHTML("🔎","amber",r.tipo||"Inspección",`${fechaLegible(r.fecha)}${r.inspector?" · "+r.inspector:""}`,`Estado: ${r.estado||"Sin estado"}`)),"No hay inspecciones pendientes registradas.");

    $("dashStatus").textContent=`Datos consultados en Supabase · Organización: ${getOrgName()} · Actualizado: ${new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}.`;
  }catch(e){
    console.error("Error al cargar tablero:",e);
    $("dashStatus").textContent="No se pudieron cargar todos los indicadores. Revisá conexión, columnas y políticas RLS.";
    ["dashVencList","dashAccList","dashCapList","dashInspList"].forEach(id=>{
      if($(id))$(id).innerHTML='<div class="dashboard-empty">No se pudieron consultar estos datos.</div>';
    });
  }
}

async function initialize(){
  const {data,error}=await db.auth.getUser();if(error)throw error;
  user=data.user;if(!user)throw new Error("No hay una sesión activa.");
  const {data:members,error:me}=await db.from("usuarios_organizaciones").select("organizacion_id,rol").eq("usuario_id",user.id).eq("activo",true);
  if(me)throw me;
  const ids=[...new Set((members||[]).map(x=>x.organizacion_id).filter(Boolean))];
  if(!ids.length)throw new Error("Tu usuario no tiene una organización activa asignada.");
  const {data:orgs,error:oe}=await db.from("organizaciones").select("id,nombre").in("id",ids);if(oe)throw oe;
  organizations=orgs||[];if(!organizations.length)throw new Error("No se encontraron organizaciones autorizadas.");
  activeOrg=organizations[0].id;
  const select=$("orgSelect");select.replaceChildren();
  organizations.forEach(o=>{const op=document.createElement("option");op.value=o.id;op.textContent=o.nombre||"Organización";select.appendChild(op)});
  select.value=activeOrg;
  select.onchange=()=>{activeOrg=select.value;moduleCache={};openModule(activeModule)};
  showApp();buildNav();await renderHome();
}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();const b=$("loginButton");b.disabled=true;b.textContent="Ingresando...";$("loginMessage").textContent="";
  try{const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error;await initialize()}
  catch(e){console.error(e);showLogin("No se pudo iniciar sesión: "+e.message)}
  finally{b.disabled=false;b.textContent="Ingresar"}
});
$("logoutButton").addEventListener("click",async()=>{
  const {error}=await db.auth.signOut();if(error){alert("No se pudo cerrar sesión: "+error.message);return}
  user=null;organizations=[];activeOrg="";moduleCache={};showLogin();
});
$("refreshAll").addEventListener("click",()=>{moduleCache={};openModule(activeModule)});
db.auth.getSession().then(async({data,error})=>{
  if(error){showLogin("No se pudo verificar la sesión.");return}
  if(data.session){try{await initialize()}catch(e){console.error(e);showLogin("No se pudo iniciar la aplicación: "+e.message)}}else showLogin();
});
db.auth.onAuthStateChange(event=>{if(event==="SIGNED_OUT")showLogin()});
